name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sujian_test
          MYSQL_USER: sujian
          MYSQL_PASSWORD: ci-test-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./mvnw -f server/pom.xml -B verify
      - run: ./mvnw -f server/pom.xml -B test
        env:
          TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/sujian_test?sslMode=DISABLED&allowPublicKeyRetrieval=true
          DATABASE_USER: sujian
          DATABASE_PASSWORD: ci-test-password
      - run: npm ci --prefix web && cp web/.env.example web/.env.local && npm run build --prefix web
      - run: npm ci --prefix mini && cp mini/.env.example mini/.env.local && npm run build:mp-weixin --prefix mini
      - name: Browser acceptance
        run: |
          python3 scripts/dev-env.py
          nohup ./scripts/run-server.sh > /tmp/sujian-server.log 2>&1 &
          nohup npm run dev --prefix web > /tmp/sujian-web.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/actuator/health > /dev/null && curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          cd web
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://127.0.0.1:5173 npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: build-and-tests
          path: |
            web/dist
            mini/dist/build/mp-weixin
            server/target/*.jar
            server/target/surefire-reports
            web/playwright-report
            docs/screenshots
