services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Required}
      MYSQL_USER: ${MYSQL_USER:?Required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h localhost -u $$MYSQL_USER --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
  server:
    build: ./server
    env_file: .env
    restart: unless-stopped
    environment:
      APP_DEV_MODE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./secrets/wechat:/run/secrets/wechat:ro
    expose: ["8080"]
  web:
    build: ./web
    restart: unless-stopped
    environment:
      API_UPSTREAM_URL: ${API_UPSTREAM_URL:?Required}
    ports: ["${WEB_BIND:?Required}:80"]
    depends_on: [server]
volumes:
  mysql-data:
