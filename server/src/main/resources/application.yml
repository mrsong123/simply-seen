server:
  port: ${PORT:8080}
  error:
    include-message: never
  forward-headers-strategy: framework
spring:
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/mall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}

  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    url: /openapi.json
